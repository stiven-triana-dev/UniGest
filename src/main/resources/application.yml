spring:
  application:
    name: unigest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unigest}
    username: ${DB_USER:unigest}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
